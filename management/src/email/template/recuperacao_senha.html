<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Recuperação de Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .header {
            text-align: center;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .content {
            color: #333;
            padding: 20px;
        }

        .user-info {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .reset-link {
            display: inline-block;
            padding: 8px;
            font-size: 14px;
            color: #ffffff;
            background-color: #ed3615;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .reset-link:hover {
            background-color: #bf280d;
            color: #ffffff
        }

        .footer {
            text-align: center;
            color: #aaa;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Recuperação de Senha</h1>
        </div>
        <div class="content">
            <p class="user-info">Olá, {{ full_name }}!</p>
            <p>Aqui está o link para sua redefinição de senha: 
                <a class='reset-link' href='{{ data.reset_link }}'>REDEFINIR SENHA</a>
            </p>
            <p>Caso não tenha realizado essa solicitação, favor desconsiderar este e-mail.</p>
        </div>
        <div class="footer">
            <p>&copy; 2024. Todos os direitos reservados.</p>
        </div>
    </div>
</body>

</html>
